<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 920" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c23b22"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1300" height="920" fill="#ffffff"/>

  <text x="20" y="24" font-size="16" font-weight="700" fill="#111">① 레이어 구조 — 포트 &amp; 어댑터 (coupon-system / apps/api)</text>

  <!-- Client -->
  <rect x="500" y="45" width="300" height="32" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="650" y="65" font-size="12" text-anchor="middle" fill="#1a2333">웹 (apps/web) — React + Vite + TS</text>
  <line x1="650" y1="77" x2="650" y2="94" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="660" y="90" font-size="10" fill="#555">HTTP 요청</text>

  <!-- Band A: presentation -->
  <rect x="20" y="95" width="1260" height="75" rx="10" fill="#eef4ff" stroke="#4f6bed" stroke-width="1.2"/>
  <text x="40" y="112" font-size="11" font-weight="700" fill="#3450b8">presentation</text>
  <rect x="460" y="118" width="380" height="35" rx="6" fill="#ffffff" stroke="#4f6bed" stroke-width="1.5"/>
  <text x="650" y="139" font-size="11.5" text-anchor="middle" fill="#1a2333">CouponIssueController · CouponQueryController · UserController</text>

  <line x1="650" y1="153" x2="650" y2="213" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="660" y="186" font-size="10" fill="#555">위임</text>

  <!-- Band B: application -->
  <rect x="20" y="190" width="1260" height="140" rx="10" fill="#eefaf0" stroke="#22a35a" stroke-width="1.2"/>
  <text x="40" y="207" font-size="11" font-weight="700" fill="#187a42">application — 발급 전략 4종 (학습 비교용) + 비동기 컨슈머</text>

  <!-- B1 active -->
  <rect x="45" y="215" width="230" height="100" rx="6" fill="#e6ffe9" stroke="#16803c" stroke-width="2.5"/>
  <text x="160" y="238" font-size="11.5" font-weight="700" text-anchor="middle" fill="#0f5c2e">CouponIssueService</text>
  <text x="160" y="256" font-size="10.5" text-anchor="middle" fill="#1a2333">비관 락 (findByCouponIdForUpdate)</text>
  <text x="160" y="278" font-size="10" text-anchor="middle" fill="#0f5c2e" font-weight="700">● 컨트롤러에 연결됨 (Day 4)</text>

  <!-- B2 -->
  <rect x="290" y="215" width="230" height="100" rx="6" fill="#ffffff" stroke="#888" stroke-width="1.3" stroke-dasharray="6,4"/>
  <text x="405" y="238" font-size="11.5" font-weight="700" text-anchor="middle" fill="#333">OptimisticCouponIssueService</text>
  <text x="405" y="256" font-size="10.5" text-anchor="middle" fill="#1a2333">낙관 락 (@Version + 재시도)</text>
  <text x="405" y="278" font-size="10" text-anchor="middle" fill="#666">○ 테스트로만 검증 (Day 5)</text>

  <!-- B3 -->
  <rect x="535" y="215" width="230" height="100" rx="6" fill="#ffffff" stroke="#888" stroke-width="1.3" stroke-dasharray="6,4"/>
  <text x="650" y="238" font-size="11.5" font-weight="700" text-anchor="middle" fill="#333">RedisCouponIssueService</text>
  <text x="650" y="256" font-size="10.5" text-anchor="middle" fill="#1a2333">Redis Lua 게이트 (동기 발급)</text>
  <text x="650" y="278" font-size="10" text-anchor="middle" fill="#666">○ 테스트로만 검증 (Day 6)</text>

  <!-- B4 -->
  <rect x="780" y="215" width="230" height="100" rx="6" fill="#ffffff" stroke="#888" stroke-width="1.3" stroke-dasharray="6,4"/>
  <text x="895" y="238" font-size="11.5" font-weight="700" text-anchor="middle" fill="#333">RedisKafkaCouponIssueService</text>
  <text x="895" y="256" font-size="10.5" text-anchor="middle" fill="#1a2333">Redis 게이트 + Kafka 발행</text>
  <text x="895" y="278" font-size="10" text-anchor="middle" fill="#666">○ 테스트로만 검증 (Day 7, 진행중)</text>

  <!-- B5 -->
  <rect x="1025" y="215" width="230" height="100" rx="6" fill="#ffffff" stroke="#888" stroke-width="1.3" stroke-dasharray="6,4"/>
  <text x="1140" y="238" font-size="11.5" font-weight="700" text-anchor="middle" fill="#333">CouponIssueEventConsumer</text>
  <text x="1140" y="256" font-size="10.5" text-anchor="middle" fill="#1a2333">Kafka 컨슈머 (비동기 영속)</text>
  <text x="1140" y="278" font-size="10" text-anchor="middle" fill="#666">○ persist 재사용 + 실패 보상</text>

  <line x1="650" y1="315" x2="650" y2="366" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="660" y="343" font-size="10" fill="#555">포트 인터페이스 호출 (구현 비의존)</text>

  <!-- Band C: domain ports -->
  <rect x="20" y="345" width="1260" height="80" rx="10" fill="#fff8e6" stroke="#d98c00" stroke-width="1.2"/>
  <text x="40" y="362" font-size="11" font-weight="700" fill="#a86400">domain — 포트 (인터페이스)</text>
  <rect x="150" y="368" width="300" height="45" rx="6" fill="#ffffff" stroke="#d98c00" stroke-width="1.3" stroke-dasharray="4,3"/>
  <text x="300" y="386" font-size="10.5" text-anchor="middle" fill="#1a2333">CouponRepository · CouponStockRepository</text>
  <text x="300" y="401" font-size="10.5" text-anchor="middle" fill="#1a2333">CouponIssueRepository · UserRepository</text>
  <rect x="500" y="368" width="300" height="45" rx="6" fill="#ffffff" stroke="#d98c00" stroke-width="1.3" stroke-dasharray="4,3"/>
  <text x="650" y="394" font-size="11.5" text-anchor="middle" fill="#1a2333">StockReservation</text>
  <rect x="850" y="368" width="300" height="45" rx="6" fill="#ffffff" stroke="#d98c00" stroke-width="1.3" stroke-dasharray="4,3"/>
  <text x="1000" y="394" font-size="11.5" text-anchor="middle" fill="#1a2333">CouponIssueEventPublisher</text>

  <line x1="300" y1="413" x2="300" y2="466" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="650" y1="413" x2="650" y2="466" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1000" y1="413" x2="1000" y2="466" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="660" y="440" font-size="10" fill="#555">구현 (어댑터)</text>

  <!-- Band D: infrastructure adapters -->
  <rect x="20" y="445" width="1260" height="80" rx="10" fill="#f5edff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="40" y="462" font-size="11" font-weight="700" fill="#5b21b6">infrastructure — 어댑터</text>
  <rect x="150" y="468" width="300" height="45" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.3"/>
  <text x="300" y="493" font-size="10.5" text-anchor="middle" fill="#1a2333">JPA Repository Adapters</text>
  <text x="300" y="507" font-size="9.5" text-anchor="middle" fill="#555">(Coupon · Stock · Issue · User)</text>
  <rect x="500" y="468" width="300" height="45" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.3"/>
  <text x="650" y="493" font-size="10.5" text-anchor="middle" fill="#1a2333">RedisStockReservation</text>
  <text x="650" y="507" font-size="9.5" text-anchor="middle" fill="#555">Lua: reserve_stock / reserve_stock_dedup</text>
  <rect x="850" y="468" width="300" height="45" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.3"/>
  <text x="1000" y="493" font-size="10.5" text-anchor="middle" fill="#1a2333">KafkaCouponIssueEventPublisher</text>
  <text x="1000" y="507" font-size="9.5" text-anchor="middle" fill="#555">acks=all, 동기 대기</text>

  <line x1="300" y1="513" x2="300" y2="566" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="650" y1="513" x2="650" y2="566" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1000" y1="513" x2="1000" y2="566" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="660" y="540" font-size="10" fill="#555">실제 저장소</text>

  <!-- Band E: datastore -->
  <rect x="20" y="545" width="1260" height="80" rx="10" fill="#f2f2f2" stroke="#555" stroke-width="1.2"/>
  <text x="40" y="562" font-size="11" font-weight="700" fill="#444">datastore (docker-compose 공용 인프라)</text>
  <rect x="150" y="568" width="300" height="45" rx="6" fill="#eaf1fb" stroke="#336791" stroke-width="1.5"/>
  <text x="300" y="588" font-size="10.5" text-anchor="middle" fill="#1a2333" font-weight="700">PostgreSQL :15432</text>
  <text x="300" y="603" font-size="9.5" text-anchor="middle" fill="#333">coupon_stocks · coupon_issues · users</text>
  <rect x="500" y="568" width="300" height="45" rx="6" fill="#fdeceb" stroke="#d82c20" stroke-width="1.5"/>
  <text x="650" y="588" font-size="10.5" text-anchor="middle" fill="#1a2333" font-weight="700">Redis :6379</text>
  <text x="650" y="603" font-size="9.5" text-anchor="middle" fill="#333">coupon:stock:{id} · coupon:issued:{id}</text>
  <rect x="850" y="568" width="300" height="45" rx="6" fill="#ececec" stroke="#231f20" stroke-width="1.5"/>
  <text x="1000" y="588" font-size="10.5" text-anchor="middle" fill="#1a2333" font-weight="700">Kafka (KRaft 단일 브로커)</text>
  <text x="1000" y="603" font-size="9.5" text-anchor="middle" fill="#333">topic: coupon-issue-requests</text>

  <!-- Section 2 -->
  <text x="20" y="655" font-size="16" font-weight="700" fill="#111">② Redis + Kafka 비동기 발급 흐름 상세 (Day 7, 진행중)</text>

  <rect x="60" y="675" width="220" height="90" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="170" y="697" font-size="11" font-weight="700" text-anchor="middle" fill="#1a2333">1. 클라이언트 요청</text>
  <text x="170" y="714" font-size="9.5" text-anchor="middle" fill="#333">POST /api/coupons/{id}/issue</text>

  <rect x="300" y="675" width="220" height="90" rx="6" fill="#fdeceb" stroke="#d82c20" stroke-width="1.5"/>
  <text x="410" y="697" font-size="11" font-weight="700" text-anchor="middle" fill="#1a2333">2. Redis Lua 원자 게이트</text>
  <text x="410" y="713" font-size="9.5" text-anchor="middle" fill="#333">reserveWithDedup</text>
  <text x="410" y="727" font-size="9.5" text-anchor="middle" fill="#333">(재고차감 + 중복차단, 1 RTT)</text>

  <rect x="540" y="675" width="220" height="90" rx="6" fill="#ececec" stroke="#231f20" stroke-width="1.5"/>
  <text x="650" y="697" font-size="11" font-weight="700" text-anchor="middle" fill="#1a2333">3. Kafka 발행</text>
  <text x="650" y="713" font-size="9.5" text-anchor="middle" fill="#333">topic: coupon-issue-requests</text>
  <text x="650" y="727" font-size="9.5" text-anchor="middle" fill="#333">key=couponId, acks=all(동기)</text>

  <rect x="780" y="675" width="220" height="90" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="890" y="697" font-size="11" font-weight="700" text-anchor="middle" fill="#1a2333">4. 컨슈머 소비</text>
  <text x="890" y="713" font-size="9.5" text-anchor="middle" fill="#333">CouponIssueEventConsumer</text>
  <text x="890" y="727" font-size="9" text-anchor="middle" fill="#666">재배달 중복 → 반납없이 ack만</text>

  <rect x="1020" y="675" width="220" height="90" rx="6" fill="#eaf1fb" stroke="#336791" stroke-width="1.5"/>
  <text x="1130" y="697" font-size="11" font-weight="700" text-anchor="middle" fill="#1a2333">5. DB 영속</text>
  <text x="1130" y="713" font-size="9.5" text-anchor="middle" fill="#333">RedisCouponIssuePersist</text>
  <text x="1130" y="727" font-size="9.5" text-anchor="middle" fill="#333">(발급 이력 저장)</text>

  <line x1="280" y1="720" x2="298" y2="720" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="520" y1="720" x2="538" y2="720" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="760" y1="720" x2="778" y2="720" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1000" y1="720" x2="1018" y2="720" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- compensation arrows -->
  <path d="M 650 765 L 650 800 L 410 800 L 410 767" fill="none" stroke="#c23b22" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowRed)"/>
  <text x="530" y="815" font-size="10" text-anchor="middle" fill="#c23b22">발행 실패 → releaseWithDedup (동기 보상)</text>

  <path d="M 1130 765 L 1130 840 L 410 840 L 410 767" fill="none" stroke="#c23b22" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowRed)"/>
  <text x="770" y="855" font-size="10" text-anchor="middle" fill="#c23b22">영속 실패(일시적) → releaseWithDedup 후 폐기</text>

  <!-- legend -->
  <rect x="60" y="878" width="18" height="14" rx="3" fill="#e6ffe9" stroke="#16803c" stroke-width="2"/>
  <text x="84" y="889" font-size="10" fill="#333">컨트롤러에 연결된 활성 경로</text>
  <rect x="290" y="878" width="18" height="14" rx="3" fill="#ffffff" stroke="#888" stroke-width="1.3" stroke-dasharray="4,3"/>
  <text x="314" y="889" font-size="10" fill="#333">학습/비교용 — 테스트로만 검증됨</text>
  <line x1="540" y1="885" x2="568" y2="885" stroke="#c23b22" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowRed)"/>
  <text x="574" y="889" font-size="10" fill="#333">실패 시 보상 흐름</text>
</svg>
